<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presupuesto mensual</title>
<style>
:root{--n:#1b2a41;--l:#f2f4f7;--b:#cfd6e0;--r:#b91c1c;--g:#166534}
*{box-sizing:border-box}body{font:14px Arial,sans-serif;margin:0;background:var(--l);color:#111}
header{background:var(--n);color:#fff;padding:16px 24px;font-size:20px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
header input{padding:6px;border-radius:4px;border:0}
main{max-width:1000px;margin:20px auto;padding:0 12px;display:grid;gap:16px}
.card{background:#fff;border:1px solid var(--b);border-radius:6px;padding:16px}
h2{margin:0 0 12px;font-size:13px;letter-spacing:.05em;color:var(--n)}
.big{font-size:34px;font-weight:bold}.bar{height:16px;background:var(--b);border-radius:8px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:var(--n);transition:width .3s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.kpis div{background:var(--l);padding:10px;border-radius:4px}.kpis b{display:block;font-size:16px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
input,select,button{padding:8px;border:1px solid var(--b);border-radius:4px;font:inherit}
button{background:var(--n);color:#fff;border:0;cursor:pointer}button.x{background:#fff;color:var(--r);border:1px solid var(--b);padding:4px 8px}
table{width:100%;border-collapse:collapse}th{background:var(--b);text-align:left;padding:6px}td{padding:6px;border-bottom:1px solid var(--b)}
.v{color:var(--r);font-weight:bold}.p{color:var(--g);font-weight:bold}#err{color:var(--r);padding:0 24px}
</style></head><body>
<header>PRESUPUESTO MENSUAL<span><input type="month" id="mes"> <input type="password" id="pw" placeholder="Clave"></span></header>
<div id="err"></div>
<main>
<section class="card"><h2>TE QUEDA PARA GASTAR</h2><div class="big" id="queda">$0</div>
<div class="bar"><div id="barra" style="width:0"></div></div><small id="de"></small>
<div class="kpis" id="kpis"></div></section>

<section class="card"><h2>REGISTRAR MOVIMIENTO</h2>
<form id="fm"><input type="date" name="fecha" required><input name="descripcion" placeholder="Descripción">
<select name="tipo"><option>Ingreso</option><option>Necesidad</option><option>Gusto</option><option>Ahorro</option></select>
<input type="number" name="monto" min="1" step="any" placeholder="Monto" required><button>Agregar</button></form>
<table id="tm"></table></section>

<section class="card"><h2>DEUDAS</h2>
<form id="fd"><input name="acreedor" placeholder="Acreedor" required><input name="concepto" placeholder="Concepto">
<select name="tipo" title="Préstamo = me dieron plata (suma al presupuesto)"><option>Préstamo</option><option>Deuda</option></select>
<input type="number" name="monto" min="1" step="any" placeholder="Monto" required><input type="date" name="fecha" title="Fecha en que la recibí">
<input type="date" name="fechaLimite" title="Fecha límite"><button>Agregar</button></form>
<small>Préstamo = te dieron plata (se suma a tus ingresos). Deuda = solo la debes.</small><table id="td"></table></section>
</main>
<script>
const $=s=>document.querySelector(s),money=n=>'$'+Math.round(n).toLocaleString('es-CO');
const hoy=new Date().toISOString().slice(0,10);$('#mes').value=hoy.slice(0,7);$('[name=fecha]').value=hoy;
$('#pw').value=localStorage.pw||'';$('#pw').onchange=e=>{localStorage.pw=e.target.value;cargar()};$('#mes').onchange=()=>cargar();
async function api(u,o={}){const r=await fetch(u,{...o,headers:{'content-type':'application/json','x-password':localStorage.pw||''},body:o.body&&JSON.stringify(o.body)});
 const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
function form(f,url,after){f.onsubmit=async e=>{e.preventDefault();try{await api(url,{method:'POST',body:Object.fromEntries(new FormData(f))});f.reset();$('[name=fecha]').value=hoy;cargar()}catch(x){$('#err').textContent=x.message}}}
form($('#fm'),'/api/movimientos');form($('#fd'),'/api/deudas');
async function borrar(u){await api(u,{method:'DELETE'});cargar()}
async function abonar(id){const m=prompt('Monto del abono');if(m){await api('/api/deudas?id='+id,{method:'PATCH',body:{monto:m}});cargar()}}
async function cargar(){try{$('#err').textContent='';const mes=$('#mes').value;
 const [r,m,d]=await Promise.all([api('/api/resumen?mes='+mes),api('/api/movimientos?mes='+mes),api('/api/deudas')]);
 $('#queda').textContent=money(r.queda);$('#queda').style.color=r.queda<0?'var(--r)':'';$('#barra').style.width=(r.porcentajeQueda*100)+'%';
 $('#de').textContent=`${Math.round(r.porcentajeQueda*100)}% de ${money(r.ingresos)} recibidos este mes`;
 $('#kpis').innerHTML=[['Necesidades',r.gastos.Necesidad],['Gustos',r.gastos.Gusto],['Ahorros',r.gastos.Ahorro],['Abonos a deudas',r.abonos],['Préstamos recibidos',r.prestamos],['Falta por pagar',r.faltaDeudas]].map(([a,b])=>`<div>${a}<b>${money(b)}</b></div>`).join('');
 $('#tm').innerHTML='<tr><th>Fecha<th>Descripción<th>Tipo<th>Monto<th></tr>'+m.map(x=>`<tr><td>${x.fecha}<td>${x.descripcion}<td>${x.tipo}<td>${money(x.monto)}<td><button class=x onclick="borrar('/api/movimientos?id=${x._id}')">✕</button>`).join('');
 $('#td').innerHTML='<tr><th>Acreedor<th>Concepto<th>Tipo<th>Deuda<th>Abonado<th>Falta<th>Límite<th>Estado<th></tr>'+d.map(x=>{const ab=(x.abonos||[]).reduce((a,y)=>a+y.monto,0),f=x.monto-ab;
  const e=f<=0?'<span class=p>Pagado</span>':(x.fechaLimite&&x.fechaLimite<hoy?'<span class=v>Vencida</span>':'Pendiente');
  return `<tr><td>${x.acreedor}<td>${x.concepto}<td>${x.tipo}<td>${money(x.monto)}<td>${money(ab)}<td>${money(f)}<td>${x.fechaLimite||''}<td>${e}<td><button onclick="abonar('${x._id}')">Abonar</button> <button class=x onclick="borrar('/api/deudas?id=${x._id}')">✕</button>`}).join('')
}catch(x){$('#err').textContent=x.message}}
cargar();
</script></body></html>
